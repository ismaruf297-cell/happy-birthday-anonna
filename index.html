<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Anonna ❤️</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

</head>

<body>

<div class="stars"></div>

<div class="container">

<h1>🎂 Happy Birthday 🎂</h1>

<h2>Anonna ❤️</h2>

<p>
May Allah bless you with happiness,
success and endless smiles.
</p>

<button id="startBtn">
Open My Surprise 🎁
</button>

</div>

<section id="gallery" class="hidden">

<h2>Our Beautiful Memories 📸</h2>

<div class="slider">

<img id="slide" src="images/photo1.jpg">

</div>

<button id="nextPhoto">
Next Photo ❤️
</button>

</section>

<section id="letter" class="hidden">

<h2>💌 A Letter For You</h2>

<div class="letter">

<p id="typing"></p>

</div>

<button id="continueBtn">
Continue 🎂
</button>

</section>

<section id="birthday" class="hidden">

<h1>🎉 Happy Birthday 🎉</h1>

<h2>30 October ❤️</h2>

<p>
May every dream of yours come true.
Stay happy forever.
</p>

<div class="cake">
🎂
</div>

</section>

<audio id="music" loop>
<source src="music/birthday.mp3" type="audio/mpeg">
</audio>

<script src="script.js"></script>

</body>
</html>
